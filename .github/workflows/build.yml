name: Build Switch NRO
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: dkp-pacman -Syu --noconfirm switch-sdl2 switch-sdl2_mixer switch-sdl2_ttf
      - name: Get Font
        run: mkdir -p romfs && curl -L -o romfs/font.ttf https://githubusercontent.com
      - name: Make NRO
        run: make
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: switch-mahjong-nro
          path: switch-mahjong.nro
