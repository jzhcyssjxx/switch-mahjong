name: Build Switch NRO
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Get Chinese Font
        run: |
          apt-get update && apt-get install -y fonts-noto-cjk
          mkdir -p romfs
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc romfs/font.ttf
      - name: Make NRO
        run: make
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: switch-mahjong-nro
          path: switch-mahjong.nro
