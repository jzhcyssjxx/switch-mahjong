name: Build Switch NRO
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Get Chinese Font & Fix Images
        run: |
          apt-get update && apt-get install -y fonts-wqy-microhei imagemagick
          mkdir -p romfs
          cp /usr/share/fonts/truetype/wqy/wqy-microhei.ttc romfs/font.ttf
          mogrify -resize 160x160 romfs/*.png || true
          if [ -f icon.jpg ]; then convert icon.jpg -resize 256x256! -strip -interlace none JPEG:icon.jpg; fi
      - name: Make NRO
        run: make
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: switch-mahjong-nro
          path: switch-mahjong.nro
